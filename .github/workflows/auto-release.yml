name: Auto release

# 판정 규칙과 스크립트는 jeongph/claude-plugins 에 있다.
# 규칙을 바꾸려면 그 레포의 .github/scripts/next-version.sh 를 고친다.
#
# 커밋 타입에서 다음 버전을 정해 plugin.json 을 올리고 태그와 Release 를
# 만든다. feat 은 minor, fix 는 patch, docs·chore 만 쌓이면 아무 일도
# 일어나지 않는다.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    uses: jeongph/claude-plugins/.github/workflows/auto-release.yml@main
    permissions:
      contents: write
